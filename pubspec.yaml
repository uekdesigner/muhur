name: muhurpm
description: "Muhur - password manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  cryptography: ^2.9.0
  local_auth: ^3.0.2
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_commons: ^0.13.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

package_rename_config:
  android:
    app_name: Muhur
    package_name: com.muhur.app
  ios:
    app_name: Muhur
    bundle_name: Muhur
    package_name: com.muhur.app

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/android_eski_C_seffaf_tam.png"
  image_path_ios: "assets/icon/ios_A_acik_zemin.png"
  remove_alpha_ios: true